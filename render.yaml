# Render blueprint — one-click backend + Postgres.
# In Render: New → Blueprint → point at this repo. When prompted, paste your
# Neon DATABASE_URL. Then deploy the frontend separately on Vercel
# (root directory = frontend).
#
# Notes (free tier): the web service sleeps after ~15 min idle (first request
# wakes it, ~50s cold start). Database is external (Neon) so it persists.
services:
  - type: web
    name: fpl-edge-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /api/health
    envVars:
      # paste your Neon connection string in the Render dashboard when prompted
      - key: DATABASE_URL
        sync: false
      - key: AUTO_SYNC_ON_STARTUP
        value: "true"
      - key: ENABLE_SCHEDULER
        value: "true"
      - key: PROJECTION_HORIZON
        value: "8"
      - key: MONTECARLO_ITERATIONS
        value: "6000"
      # Domain Vercel của frontend. `sync: false` để Render HỎI giá trị khi deploy
      # thay vì im lặng dùng một placeholder — placeholder sai thì trình duyệt bị
      # CORS chặn và lỗi hiện ra ở phía frontend, rất khó truy về đây.
      - key: CORS_ORIGINS
        sync: false
      # optional probability provider
      - key: ODDS_API_KEY
        sync: false

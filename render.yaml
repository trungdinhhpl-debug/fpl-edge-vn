# Render blueprint — one-click backend + Postgres.
# In Render: New → Blueprint → point at this repo. Then deploy the frontend
# separately on Vercel (root directory = frontend).
#
# Notes (free tier): the web service sleeps after ~15 min idle (first request
# wakes it, ~50s cold start); free Postgres expires after 90 days. Fine for
# sharing with friends; upgrade for always-on.
services:
  - type: web
    name: fpl-edge-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: fpl-edge-db
          property: connectionString
      - key: AUTO_SYNC_ON_STARTUP
        value: "true"
      - key: ENABLE_SCHEDULER
        value: "true"
      - key: PROJECTION_HORIZON
        value: "8"
      - key: MONTECARLO_ITERATIONS
        value: "6000"
      # replace with your Vercel domain after the frontend is deployed
      - key: CORS_ORIGINS
        value: "https://your-app.vercel.app"
      # optional probability provider
      - key: ODDS_API_KEY
        sync: false

databases:
  - name: fpl-edge-db
    plan: free
    databaseName: fpl_edge
    user: fpl
